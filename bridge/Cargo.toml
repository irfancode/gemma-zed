[package]
name = "gemma-zed-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gemma-zed-bridge"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"